<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jennifer Mancini — VSL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#B115D8;--brand-hover:#8F0FB0;--ink:#0f1117;--muted:#4b5563;--line:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#fff;color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
.container{max-width:820px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{height:44px;width:auto;max-width:220px;object-fit:contain;margin-bottom:22px}
.tag{display:inline-block;background:var(--brand);color:#fff;padding:5px 12px;border-radius:9999px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(26px,4.2vw,40px);font-weight:800;line-height:1.15;letter-spacing:-.8px;margin-bottom:16px}
.sub{font-size:clamp(15px,2.2vw,18px);color:var(--muted);max-width:660px;margin-bottom:28px;font-weight:500}
.ph{width:100%;max-width:640px;border:2px dashed var(--line);border-radius:12px;padding:28px 20px;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:28px}
.cta{width:100%;max-width:490px;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:16px 24px;font:800 20px 'Plus Jakarta Sans',sans-serif;cursor:pointer;box-shadow:0 8px 24px -4px rgba(177,21,216,.4)}
.cta:hover{background:var(--brand-hover)}
.note{margin-top:26px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="container">
<img class="logo" src="https://i.imgur.com/rZrrfQx.png" alt="Jennifer Mancini">
<span class="tag">VSL</span>
<h1>[VSL page headline]</h1>
<p class="sub">[VSL subheadline]</p>
<div class="ph">▶ [VSL video embed]</div>
<button class="cta">Yes! Book My Call →</button>
<p class="note">Placeholder page — final copy and layout coming soon.</p>
</div>
</body>
</html>
