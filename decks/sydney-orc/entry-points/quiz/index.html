<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sydney Mohni — Find Your UGC Path</title>
<style>
:root{--brand:#DA372A;--brand-d:#B02A1E;--soft:#FFF0EE;--soft2:#FFE3E0;--line:#F1D5D1;--ink:#1d1210;--mut:#6b5a57;--ok:#1E9E5A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#fff 0%,#FFF6F4 100%);color:var(--ink);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 20px 28px}
.hdr{display:flex;align-items:center;gap:12px;height:62px}
.back{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--brand);font:700 18px inherit;cursor:pointer;visibility:hidden}
.back.show{visibility:visible}
.logo{margin:0 auto;display:flex;align-items:center;gap:8px;font:800 14px inherit;letter-spacing:.01em}
.logo img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--soft)}
.pg{width:36px;font:700 11px ui-monospace,monospace;color:var(--mut);text-align:right}
.bar{height:6px;border-radius:99px;background:var(--soft2);overflow:hidden;margin-bottom:26px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F26A5C,var(--brand));border-radius:99px;transition:width .45s cubic-bezier(.3,.8,.3,1)}
.screen{flex:1;display:flex;flex-direction:column;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-block;align-self:flex-start;background:var(--soft);color:var(--brand);font:800 11px inherit;letter-spacing:.1em;text-transform:uppercase;padding:6px 11px;border-radius:99px;margin-bottom:14px}
h1{font-size:clamp(28px,7.4vw,38px);line-height:1.08;letter-spacing:-.03em;margin:0 0 12px;font-weight:850}
h1 em{font-style:normal;color:var(--brand)}
h2{font-size:clamp(23px,6vw,29px);line-height:1.15;letter-spacing:-.02em;margin:0 0 8px;font-weight:800;text-align:center}
.sub{color:var(--mut);font-size:16px;line-height:1.5;margin:0 0 22px}
.hint{text-align:center;color:var(--mut);font-size:14px;margin:0 0 22px}
.cards{display:grid;gap:11px}
.card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 16px;font:650 16px/1.3 inherit;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s,box-shadow .15s;box-shadow:0 1px 0 rgba(218,55,42,.05)}
.card:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:0 6px 18px rgba(218,55,42,.12)}
.card:active{transform:scale(.985)}
.card .em{flex:none;width:46px;height:46px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:25px}
.card .tx{flex:1}.card .tx small{display:block;font-weight:500;color:var(--mut);font-size:13px;margin-top:2px}
.card .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800}
.card.sel{border-color:var(--brand);background:var(--soft)}.card.sel .ck{background:var(--brand);border-color:var(--brand)}
.statement{background:#fff;border:2px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center;font:800 clamp(21px,5.6vw,26px)/1.25 inherit;letter-spacing:-.015em;margin-bottom:20px;box-shadow:0 10px 30px rgba(218,55,42,.08)}
.statement span{display:block;font-size:34px;margin-bottom:10px}
.scale{display:grid;gap:10px}
.scale .card{justify-content:center;text-align:center;font-weight:700}
.btn{border:0;background:var(--brand);color:#fff;font:800 17px inherit;padding:18px 22px;border-radius:16px;cursor:pointer;width:100%;box-shadow:0 10px 24px rgba(218,55,42,.3);transition:.15s}
.btn:hover{background:var(--brand-d);transform:translateY(-1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.foot{margin-top:auto;padding-top:22px}
.fine{font-size:12px;color:var(--mut);text-align:center;margin-top:12px}
/* interstitial */
.info{text-align:center;align-items:center;justify-content:center;padding-top:6px}
.info .big{font-size:64px;width:120px;height:120px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;margin:6px auto 22px;box-shadow:0 0 0 12px rgba(218,55,42,.07)}
.info h2{margin-bottom:12px}
.info p{color:var(--mut);font-size:17px;line-height:1.55;margin:0 0 10px;max-width:440px}
.pill{background:var(--soft);border:1.5px solid var(--brand);border-radius:16px;padding:16px 18px;margin:12px 0 4px;font-weight:700;color:var(--brand-d);font-size:15.5px;line-height:1.45;max-width:440px}
/* loading */
.load{align-items:center;text-align:center;justify-content:center}
.ring{width:132px;height:132px;border-radius:50%;margin:10px auto 24px;background:conic-gradient(var(--brand) var(--p,0%),var(--soft2) 0);display:flex;align-items:center;justify-content:center;transition:--p .3s}
.ring b{width:104px;height:104px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font:850 28px inherit;color:var(--brand)}
.steps{list-style:none;padding:0;margin:20px auto 0;display:grid;gap:12px;text-align:left;max-width:340px}
.steps li{display:flex;gap:12px;align-items:center;font-weight:650;color:#b9a8a5;transition:.3s}
.steps li i{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-style:normal}
.steps li.on{color:var(--ink)}.steps li.on i{background:var(--ok);border-color:var(--ok)}
/* result */
.rtop{background:linear-gradient(145deg,var(--brand),#B02A1E);color:#fff;border-radius:22px;padding:26px 22px;margin-bottom:16px;box-shadow:0 14px 34px rgba(218,55,42,.28)}
.rtop small{font:800 11px inherit;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.rtop h1{color:#fff;margin:8px 0 8px;font-size:clamp(26px,7vw,34px)}.rtop p{margin:0;opacity:.92;line-height:1.5;font-size:16px}
.rbox{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.rbox h3{margin:0 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.rbox ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.rbox li{display:flex;gap:10px;line-height:1.45;font-weight:600;font-size:15.5px}.rbox li:before{content:"✓";color:var(--ok);font-weight:900}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tags span{background:var(--soft);color:var(--brand-d);font-weight:700;font-size:13.5px;padding:7px 12px;border-radius:99px}
.input{width:100%;border:2px solid var(--line);border-radius:14px;padding:16px;font:600 16px inherit;margin-bottom:10px;outline:0;background:#fff}.input:focus{border-color:var(--brand)}
@media(min-width:600px){.wrap{padding-top:10px}}
</style></head><body>
<div class="wrap">
 <div class="hdr"><button class="back" id="back" aria-label="Back">←</button><div class="logo"><img src="https://i.imgur.com/eed934n.jpeg" alt="Sydney Mohni"><span>Sydney Mohni</span></div><div class="pg" id="pg"></div></div>
 <div class="bar"><i id="bar"></i></div>
 <div id="app" class="screen"></div>
</div>
<script>
var S=[
 {t:'intro'},
 {t:'q',id:'stage',e:'📍',q:'Where are you in your UGC journey right now?',h:'Pick the one that sounds most like you.',o:[['🌱','I’m curious, but haven’t created anything yet'],['🎥','I’ve made videos, but haven’t been paid yet'],['🤝','I’ve landed a few brand deals'],['📈','I get brand deals, but my income swings every month']]},
 {t:'multi',id:'block',q:'What’s holding you back the most?',h:'Select all that apply.',o:[['🤷‍♀️','I don’t know where to start'],['📭','Brands don’t reply to my pitches'],['💸','I don’t know what to charge'],['🔁','One-off deals never turn into repeat work'],['⏳','I can’t find the time']]},
 {t:'info',em:'🎬',h:'You don’t need a big following.',p:'Brands hire UGC creators for the content, not the audience. What matters is showing that you can make videos that fit what a brand needs.',pill:'Good news: this is a skill you can learn, not a talent you’re born with.'},
 {t:'scale',id:'nerv',em:'✉️',q:'I feel nervous sending a pitch to a brand.'},
 {t:'q',id:'find',q:'How do you find brands to work with today?',h:'Be honest, there’s no wrong answer.',o:[['🙈','I don’t yet'],['⏳','I wait for brands to find me'],['📬','I send pitches when I have time'],['🗓️','I have a regular outreach routine']]},
 {t:'scale',id:'rate',em:'💬',q:'When a brand pushes back on my price, I usually lower my rate.'},
 {t:'info',em:'💰',h:'Pricing is a skill, not a guess.',p:'Creators who build steady income tend to quote packages and usage rights instead of a single price per video, and they know how to negotiate without discounting.',pill:'We’ll show you what to focus on first.'},
 {t:'q',id:'time',q:'How much time can you give UGC each week?',h:'Even a few focused hours can be enough to start.',o:[['⏰','A few hours'],['☀️','About half a day'],['📅','A full day or more'],['🔥','It’s my main focus']]},
 {t:'multi',id:'content',q:'What kind of content do you enjoy creating most?',h:'Select all that apply.',o:[['🗣️','Talking-to-camera reviews'],['🧴','Product demos and tutorials'],['🏡','Lifestyle and day-in-the-life videos'],['🤔','I’m not sure yet']]},
 {t:'info',em:'⚙️',h:'Steady income comes from systems.',p:'Pitch templates, outreach scripts and a simple follow-up routine make it much easier to keep deals coming in, without starting from scratch every time.',pill:'Almost there. Just a few more questions.'},
 {t:'scale',id:'tmpl',em:'📋',q:'I’d rather use ready-made templates and scripts than figure everything out from scratch.'},
 {t:'q',id:'goal',q:'What’s your income goal with UGC?',h:'Choose what feels right for you today.',o:[['🛍️','Some extra spending money'],['💵','A solid side income'],['🚀','Replace my current job'],['🏢','Build a lasting creator business']]},
 {t:'q',id:'ready',q:'How ready are you to take the next step?',h:'This helps us recommend the right support.',o:[['🏁','I’m ready to start now'],['📚','I want to learn first'],['💎','I’m ready to invest in support'],['💬','I’d like to talk through the options']]},
 {t:'load'},
 {t:'lead'},
 {t:'result'}
];
var QN=S.filter(function(x){return x.t=='q'||x.t=='multi'||x.t=='scale'}).length+1; // +intro question counted in q list
var A={},i=0,hist=[];
var app=document.getElementById('app'),bar=document.getElementById('bar'),pg=document.getElementById('pg'),back=document.getElementById('back');
var qIndex=[];S.forEach(function(x,n){if(x.t=='q'||x.t=='multi'||x.t=='scale')qIndex.push(n)});
function qpos(n){return qIndex.indexOf(n)+1}
function esc(s){return s}
function render(){
 var x=S[i],h='';
 back.className='back'+(i>0&&x.t!='load'&&x.t!='result'?' show':'');
 var done=qIndex.filter(function(n){return n<i}).length;
 bar.style.width=(x.t=='result'||x.t=='lead'||x.t=='load'?100:Math.round(done/qIndex.length*100))+'%';
 pg.textContent=qIndex.indexOf(i)>=0?qpos(i)+'/'+qIndex.length:'';
 if(x.t=='intro'){
  h='<div class="eyebrow">Free 2-minute quiz</div><h1>Which <em>UGC path</em> is right for you?</h1><p class="sub">Answer a few quick questions and get a personalized plan for landing paid brand deals, without needing a big following.</p><div class="cards">'+S[1].o.map(function(o,j){return card(o,j,false,'stage').replace("pick('stage',"+j+")","pickIntro("+j+")")}).join('')+'</div><div class="fine">Takes about 2 minutes · No experience needed</div>';
  // intro merges question 1
 }
 else if(x.t=='q'){h='<h2>'+x.q+'</h2><p class="hint">'+x.h+'</p><div class="cards">'+x.o.map(function(o,j){return card(o,j,false,x.id)}).join('')+'</div>'}
 else if(x.t=='multi'){var sel=A[x.id]||[];h='<h2>'+x.q+'</h2><p class="hint">'+x.h+'</p><div class="cards">'+x.o.map(function(o,j){return card(o,j,true,x.id,sel.indexOf(j)>-1)}).join('')+'</div><div class="foot"><button class="btn" id="cont" onclick="cont()" '+(sel.length?'':'disabled')+'>Continue</button></div>'}
 else if(x.t=='scale'){h='<div class="statement"><span>'+x.em+'</span>'+x.q+'</div><div class="scale">'+[['👍','Agree'],['😐','Not sure'],['👎','Disagree']].map(function(o,j){return '<button class="card" onclick="pick(\''+x.id+'\','+j+')"><span class="em">'+o[0]+'</span><span class="tx">'+o[1]+'</span></button>'}).join('')+'</div>'}
 else if(x.t=='info'){h='<div class="info screen" style="animation:none"><div class="big">'+x.em+'</div><h2>'+x.h+'</h2><p>'+x.p+'</p><div class="pill">'+x.pill+'</div></div><div class="foot"><button class="btn" onclick="go()">Continue</button></div>'}
 else if(x.t=='load'){h='<div class="load screen" style="animation:none"><h2>Building your creator plan…</h2><p class="hint">Matching your answers to the right next step</p><div class="ring" id="ring"><b id="pct">0%</b></div><ul class="steps"><li id="s1"><i>✓</i>Reviewing your UGC stage</li><li id="s2"><i>✓</i>Matching your biggest blockers</li><li id="s3"><i>✓</i>Choosing your best next step</li></ul></div>';runLoad()}
 else if(x.t=='lead'){h='<div class="info screen" style="animation:none"><div class="big">🎉</div><h2>Your personalized plan is ready!</h2><p>Where should we send it?</p></div><input class="input" id="nm" placeholder="First name"><input class="input" id="em" type="email" placeholder="Email address"><div class="foot" style="padding-top:6px"><button class="btn" onclick="go()">Show my plan →</button><div class="fine">Demo page · nothing is stored or sent</div></div>'}
 else if(x.t=='result'){h=result()}
 app.className='screen';app.style.animation='none';void app.offsetWidth;app.style.animation='';app.innerHTML=h;window.scrollTo(0,0);
}
function card(o,j,multi,id,sel){return '<button class="card'+(sel?' sel':'')+'" onclick="'+(multi?'tog(\''+id+'\','+j+')':'pick(\''+id+'\','+j+')')+'"><span class="em">'+o[0]+'</span><span class="tx">'+o[1]+'</span>'+(multi?'<span class="ck">'+(sel?'✓':'')+'</span>':'')+'</button>'}
function pick(id,j){A[id]=j;setTimeout(go,220)}
function tog(id,j){var a=A[id]=A[id]||[],k=a.indexOf(j);if(k>-1)a.splice(k,1);else a.push(j);render()}
function cont(){go()}
function pickIntro(j){A.stage=j;hist.push(0);hist.push(1);i=2;setTimeout(render,200)}
function go(){hist.push(i);i++;render()}
back.onclick=function(){if(hist.length){i=hist.pop();if(S[i].t=='load'||S[i].t=='lead'){i=hist.pop()||0}render()}};
function runLoad(){var p=0,t=setInterval(function(){p+=3;if(p>100)p=100;document.getElementById('ring').style.setProperty('--p',p+'%');document.getElementById('pct').textContent=p+'%';
 if(p>=25)document.getElementById('s1').className='on';if(p>=55)document.getElementById('s2').className='on';if(p>=85)document.getElementById('s3').className='on';
 if(p>=100){clearInterval(t);setTimeout(function(){hist.push(i);i++;render()},500)}},90)}
function result(){
 var st=A.stage||0,P=[
 {n:'The Getting Started Creator',d:'You’re at the beginning, and that’s a great place to be. Your next step is a clear path to your first paid brand deal.',s:['Build a simple portfolio brands can say yes to','Use ready-to-send pitches instead of writing from scratch','Follow a step-by-step process for your first deal'],c:'Start Your UGC Journey →'},
 {n:'The Almost-There Creator',d:'You’ve already made content. What’s missing is the pitching and positioning that turn your videos into paid work.',s:['Sharpen your portfolio and your pitch','Use outreach scripts that get brands to reply','Know what to charge before you quote'],c:'Start Your UGC Journey →'},
 {n:'The Building Creator',d:'You’ve proven brands will pay you. Now it’s about consistency: a routine that brings new deals in, and prices that reflect your value.',s:['Build a repeatable outreach routine','Price in packages instead of one-off videos','Negotiate without discounting your rate'],c:'Get Ready-To-Use Pitches →'},
 {n:'The Growth Creator',d:'You already know what UGC is. Your next step isn’t more content skills, it’s pricing, negotiation, retainers and client acquisition that turn deals into predictable income.',s:['Turn one-off deals into monthly retainers','Raise your rates and handle objections confidently','Systemize client acquisition and fulfilment'],c:'Build Predictable Income →'}][st];
 var B=['Not knowing where to start','Brands not replying to pitches','Not knowing what to charge','One-off deals that don’t repeat','Not enough time'];
 var tags=(A.block||[]).map(function(j){return '<span>'+B[j]+'</span>'}).join('')||'<span>Getting clear on your next step</span>';
 var nm=(document.getElementById&&window._nm)||'';
 return '<div class="rtop"><small>Your result</small><h1>'+P.n+'</h1><p>'+P.d+'</p></div>'+
  '<div class="rbox"><h3>What you told us is holding you back</h3><div class="tags">'+tags+'</div></div>'+
  '<div class="rbox"><h3>Your recommended focus</h3><ul>'+P.s.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul></div>'+
  '<div class="foot"><button class="btn">'+P.c+'</button><div class="fine">This is a recommendation based on your answers, not a guarantee of results.</div></div>';
}
render();
</script></body></html>
